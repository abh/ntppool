name: ntppool-e2e

# The API CLI (`api e2e ...`) and the API itself talk to the database.
x-db-env: &db-env
  deployment_mode: devel
  DATABASE_URI: postgres://ntppool:ntppool@postgres:5432/ntppool?sslmode=disable
  pool_domain: test.pool.ntp.org

# Site settings the API and the Perl app share.
x-site-env: &site-env
  deployment_mode: devel
  pool_domain: test.pool.ntp.org
  web_hostname: web.ntppool.test
  manage_hostname: manage.ntppool.test
  web_tls: "yes"
  manage_tls: "yes"
  stripe_gw_service: http://stripe-gw

x-api-service: &api-service
  image: ${API_IMAGE:?set API_IMAGE (e2e/stack/up reads e2e/stack/api-image)}
  platform: linux/amd64
  environment:
    <<: [*db-env, *site-env]

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: ntppool
      POSTGRES_PASSWORD: ntppool
      POSTGRES_DB: ntppool
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ntppool -d ntppool"]
      interval: 2s
      timeout: 3s
      retries: 30

  seed:
    <<: *api-service
    user: root
    entrypoint: ["/bin/sh", "/stack/seed"]
    volumes:
      - ./:/stack:ro
      - apibin:/apibin
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    <<: *api-service
    command: ["/app/api", "internal"]
    ports:
      - "127.0.0.1:4211:4211"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4290/health/ready"]
      interval: 2s
      timeout: 3s
      retries: 30
    depends_on:
      seed:
        condition: service_completed_successfully

  ntppool:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: ntppool-e2e/ntppool:local
    environment:
      <<: *site-env
      api-internal: http://api:4211/
      # The image serves its own static files under /static/ (askdev: same).
      static_base: /static/
      httpd_maxclients: "6"
      email_default: support@ntppool.test
      email_support: support@ntppool.test
      email_help: help@ntppool.test
      email_vendors: vendors@ntppool.test
      email_notifications: notifications@ntppool.test
      # Random per stack, generated by e2e/stack/up; only needs to be non-empty.
      account_id_key: ${ACCOUNT_ID_KEY:?set ACCOUNT_ID_KEY (e2e/stack/up generates it)}
      vendor_zone_id_key: ${VENDOR_ZONE_ID_KEY:?set VENDOR_ZONE_ID_KEY (e2e/stack/up generates it)}
      # The suite never uses Auth0.
      auth0_domain: ""
      auth0_client: ""
      auth0_secret: ""
    healthcheck:
      test:
        - CMD
        - wget
        - -qO-
        - "--header=Host: web.ntppool.test"
        - "--header=X-Forwarded-Proto: https"
        - http://localhost:8299/en/
      interval: 3s
      timeout: 10s
      retries: 60
    depends_on:
      api:
        condition: service_healthy

  proxy:
    image: caddy:2
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./stripe-stub:/stripe-stub:ro
      - caddydata:/data
    ports:
      - "127.0.0.1:8443:443"
    networks:
      default:
        aliases:
          - web.ntppool.test
          - manage.ntppool.test
          - stripe-gw
    healthcheck:
      test: ["CMD", "wget", "--no-check-certificate", "-qO-", "https://manage.ntppool.test/"]
      interval: 3s
      timeout: 10s
      retries: 60
    depends_on:
      ntppool:
        condition: service_healthy

  # One-shot test runner, profile `test`; started by e2e/stack/test, never by up.
  playwright:
    profiles: ["test"]
    image: mcr.microsoft.com/playwright:v1.60.0-noble
    working_dir: /e2e
    volumes:
      - ../:/e2e
      - e2e_node_modules:/e2e/node_modules
      - apibin:/apibin:ro
      - caddydata:/caddy:ro
    environment:
      # Set explicitly so a leftover e2e/.env (askdev URLs) cannot win: dotenv
      # never overrides variables that are already set.
      E2E_TARGET: stack
      NTP_BASE_URL: https://web.ntppool.test
      NTP_MANAGE_URL: https://manage.ntppool.test
      NTP_INTERNAL_API_URL: http://api:4211/int/rpc
      NTP_API_CLI: /apibin/api
      NODE_EXTRA_CA_CERTS: /caddy/caddy/pki/authorities/local/root.crt
      # The one server seed.sql creates; an askdev value in e2e/.env would 404.
      NTP_SCORES_TEST_IP: 216.239.35.4
      <<: *db-env
      E2E_STRIPE: ${E2E_STRIPE:-}
    # An entrypoint, so the arguments of `compose run` land in "$@".
    entrypoint: ["sh", "-c", 'npm ci && npx playwright test "$$@"', "--"]

volumes:
  apibin:
  e2e_node_modules:
  caddydata:

name: ntppool-e2e

# The API CLI (`api e2e ...`) and the API itself talk to the database.
x-db-env: &db-env
  deployment_mode: devel
  DATABASE_URI: postgres://ntppool:ntppool@postgres:5432/ntppool?sslmode=disable
  pool_domain: test.pool.ntp.org

# Site settings the API and the Perl app share.
x-site-env: &site-env
  deployment_mode: devel
  pool_domain: test.pool.ntp.org
  web_hostname: web.ntppool.test
  manage_hostname: manage.ntppool.test
  web_tls: "yes"
  manage_tls: "yes"
  stripe_gw_service: http://stripe-gw
  # The otelcol service discards what it receives.
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otelcol:4318

x-api-service: &api-service
  image: ${API_IMAGE:?set API_IMAGE (e2e/stack/up reads e2e/stack/api-image)}
  platform: linux/amd64
  environment:
    <<: [*db-env, *site-env]

services:
  # Takes the traces, metrics and logs of the API and the Perl app and drops them.
  otelcol:
    image: otel/opentelemetry-collector:0.162.0
    command: ["--config=/etc/otelcol.yaml"]
    volumes:
      - ./otelcol.yaml:/etc/otelcol.yaml:ro

  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: ntppool
      POSTGRES_PASSWORD: ntppool
      POSTGRES_DB: ntppool
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ntppool -d ntppool"]
      interval: 2s
      timeout: 3s
      retries: 30

  seed:
    <<: *api-service
    user: root
    entrypoint: ["/bin/sh", "/stack/seed"]
    volumes:
      - ./:/stack:ro
      - apibin:/apibin
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    <<: *api-service
    command: ["/app/api", "internal"]
    ports:
      - "127.0.0.1:4211:4211"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4290/health/ready"]
      interval: 2s
      timeout: 3s
      retries: 30
    depends_on:
      seed:
        condition: service_completed_successfully

  ntppool:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: ntppool-e2e/ntppool:local
    environment:
      <<: *site-env
      api-internal: http://api:4211/
      # The image serves its own static files under /static/ (askdev: same).
      static_base: /static/
      httpd_maxclients: "6"
      email_default: support@ntppool.test
      email_support: support@ntppool.test
      email_help: help@ntppool.test
      email_vendors: vendors@ntppool.test
      email_notifications: notifications@ntppool.test
      # Random per stack, generated by e2e/stack/up; only needs to be non-empty.
      account_id_key: ${ACCOUNT_ID_KEY:?set ACCOUNT_ID_KEY (e2e/stack/up generates it)}
      vendor_zone_id_key: ${VENDOR_ZONE_ID_KEY:?set VENDOR_ZONE_ID_KEY (e2e/stack/up generates it)}
      # The suite never uses Auth0.
      auth0_domain: ""
      auth0_client: ""
      auth0_secret: ""
    healthcheck:
      test:
        - CMD
        - wget
        - -qO-
        - "--header=Host: web.ntppool.test"
        - "--header=X-Forwarded-Proto: https"
        - http://localhost:8299/en/
      interval: 3s
      timeout: 10s
      retries: 60
    depends_on:
      api:
        condition: service_healthy

  proxy:
    image: caddy:2
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./stripe-stub.caddy:/etc/caddy/stripe-stub.caddy:ro
      - ./stripe-real.caddy:/etc/caddy/stripe-real.caddy:ro
      - ./stripe-stub:/stripe-stub:ro
      - caddydata:/data
    environment:
      # stub or real: which stripe-gw the Caddyfile's stripe-gw site imports.
      STRIPE_MODE: ${STRIPE_MODE:?set STRIPE_MODE to stub or real (e2e/stack/up sets it)}
    ports:
      - "127.0.0.1:8443:443"
    networks:
      default:
        aliases:
          - web.ntppool.test
          - manage.ntppool.test
          - stripe-gw
    healthcheck:
      test: ["CMD", "wget", "--no-check-certificate", "-qO-", "https://manage.ntppool.test/"]
      interval: 3s
      timeout: 10s
      retries: 60
    depends_on:
      ntppool:
        condition: service_healthy

  # Profile `stripe` (E2E_STRIPE=1 e2e/stack/up): the real stripe-gw against
  # the Stripe test sandbox. Secrets and the stack id come from the
  # environment of `docker compose` (an empty value here, not an error, so
  # the stub stack still parses without them); up starts these with
  # --no-deps, in order, so none of them declares depends_on.

  # Forwards the sandbox's webhook events to stripe-gw-app and publishes the
  # signing secret for it.
  stripe-listen:
    profiles: ["stripe"]
    image: stripe/stripe-cli:v1.53.1
    entrypoint: ["/bin/sh", "/stack/stripe-listen"]
    environment:
      STRIPE_SECRET_KEY:
    volumes:
      - ./:/stack:ro
      - stripe-shared:/stripe-shared
    healthcheck:
      test: ["CMD", "test", "-s", "/stripe-shared/webhook-secret"]
      interval: 2s
      timeout: 3s
      retries: 30

  stripe-gw-app:
    profiles: ["stripe"]
    image: ${STRIPE_GW_IMAGE:?set STRIPE_GW_IMAGE (e2e/stack/up reads e2e/stack/stripe-gw-image)}
    platform: linux/amd64
    entrypoint: ["/bin/sh", "/stack/stripe-gw-start"]
    environment:
      STRIPE_SECRET_KEY:
      STRIPE_UPGRADE_PORTAL_CONFIGURATION:
      E2E_STACK_ID:
      API_URL: http://api:4211/int/rpc
      NAMESPACE: e2e
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otelcol:4318
    volumes:
      - ./:/stack:ro
      - apibin:/apibin:ro
      - stripe-shared:/stripe-shared:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:1323/__healthz"]
      interval: 2s
      timeout: 3s
      retries: 30

  # One-shot: cancels the Stripe subscriptions a stack left (e2e/stack/down).
  stripe-sweep:
    profiles: ["stripe"]
    image: alpine:3.22
    entrypoint: ["/bin/sh", "/stack/stripe-sweep"]
    environment:
      STRIPE_SECRET_KEY:
      DATABASE_URI: postgres://ntppool:ntppool@postgres:5432/ntppool?sslmode=disable
    volumes:
      - ./:/stack:ro

  # One-shot test runner, profile `test`; started by e2e/stack/test, never by up.
  playwright:
    profiles: ["test"]
    image: mcr.microsoft.com/playwright:v1.60.0-noble
    working_dir: /e2e
    volumes:
      - ../:/e2e
      - e2e_node_modules:/e2e/node_modules
      - apibin:/apibin:ro
      - caddydata:/caddy:ro
    environment:
      # Set explicitly so a leftover e2e/.env (askdev URLs) cannot win: dotenv
      # never overrides variables that are already set.
      E2E_TARGET: stack
      NTP_BASE_URL: https://web.ntppool.test
      NTP_MANAGE_URL: https://manage.ntppool.test
      NTP_INTERNAL_API_URL: http://api:4211/int/rpc
      NTP_API_CLI: /apibin/api
      NODE_EXTRA_CA_CERTS: /caddy/caddy/pki/authorities/local/root.crt
      # The one server seed.sql creates; an askdev value in e2e/.env would 404.
      NTP_SCORES_TEST_IP: 216.239.35.4
      # For `api e2e subscription cancel` and `api e2e run finish`.
      stripe_gw_service: http://stripe-gw
      <<: *db-env
      E2E_STRIPE: ${E2E_STRIPE:-}
    # An entrypoint, so the arguments of `compose run` land in "$@".
    entrypoint: ["sh", "-c", 'npm ci && npx playwright test "$$@"', "--"]

volumes:
  apibin:
  e2e_node_modules:
  caddydata:
  stripe-shared:

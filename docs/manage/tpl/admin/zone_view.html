<span id="zone_list"
      data-server-ip="[% server.ip %]"
      data-zones="[% zones %]">
[% FOR zone IN zones.split('\s+') %]
<a href="/zone/[% zone | uri %]">[% zone | html %]</a>
[% END %]
[% IF server.server_verification.verified_on OR server.verification.verified %]
&nbsp;&check;
[% END %]
[% IF manage_site AND combust.user_is_staff %]
   <button id="server_edit_zones"
           hx-get="[% combust.manage_url('/manage/admin/zones/edit', { server => server.ip, a => server.account.id_token }) %]"
           hx-target="#zone_list"
           hx-swap="outerHTML"
           class="btn btn-sm btn-outline-primary">Edit</button>
[% END %]
</span>
